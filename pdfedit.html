<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Edit — PDF 합치기·정렬·회전</title>
<style>
  :root {
    --bg: #07080d;
    --panel: rgba(255,255,255,.045);
    --panel2: rgba(255,255,255,.015);
    --accent: #fb7185;
    --accent2: #8b9dff;
    --text: #f2f4fa;
    --muted: #8f97a8;
    --line: rgba(255,255,255,.08);
    --field: #0b0d13;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 620px at 15% -12%, rgba(251,113,133,.08), transparent 60%),
      radial-gradient(1000px 700px at 85% -18%, rgba(139,157,255,.08), transparent 60%),
      var(--bg);
    color: var(--text); height: 100vh; overflow: hidden;
  }
  /* 왼쪽: 미리보기 / 오른쪽: 저장 → 업로드 → 페이지 목록 */
  .app {
    height: 100vh; padding: 16px; display: grid; gap: 14px;
    grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "view save" "view upload" "view list";
  }
  .pane {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); border-radius: 20px;
  }
  .viewer { grid-area: view; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .savebar { grid-area: save; display: flex; gap: 8px; align-items: center; padding: 10px; }
  .upload { grid-area: upload; }
  .list { grid-area: list; min-height: 0; overflow-y: auto; padding: 12px; }

  .home-btn {
    flex: none;
    width: 36px; height: 36px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    color: #eef0f6; text-decoration: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: .15s;
  }
  .home-btn:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }

  .drop {
    display: block; cursor: pointer; text-align: center;
    border: 2px dashed rgba(255,255,255,.16); border-radius: 22px;
    padding: 28px 16px; transition: .2s;
    background: linear-gradient(180deg, var(--panel), var(--panel2));
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(251,113,133,.06); }
  .drop .big { font-size: 38px; margin-bottom: 10px; }
  .drop strong { display: block; font-size: 17px; margin-bottom: 6px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .drop.compact { padding: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .drop.compact .big { font-size: 22px; margin: 0; }
  .drop.compact strong { display: inline; font-size: 14px; margin: 0; }
  .drop.compact span { display: none; }
  #fileInput { display: none; }

  .files { display: flex; flex-wrap: wrap; gap: 8px; }
  .files:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    font-size: 12.5px; padding: 6px 8px 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
  .chip .ct { color: var(--muted); }
  .chip button {
    border: none; background: rgba(255,255,255,.08); color: var(--muted);
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1;
  }
  .chip button:hover { background: rgba(251,113,133,.25); color: #fff; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin: 12px 0; padding: 10px; border-radius: 14px;
    background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line);
  }
  .toolbar .info { color: var(--muted); font-size: 13px; margin-right: auto; padding-left: 4px; }
  .toolbar .info b { color: var(--text); }
  .btn {
    border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text);
    padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: .15s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.danger:hover:not(:disabled) { background: rgba(251,113,133,.2); border-color: rgba(251,113,133,.4); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .page {
    position: relative; border-radius: 16px; padding: 10px 10px 8px;
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); cursor: grab; user-select: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .page:hover { border-color: rgba(255,255,255,.2); }
  .page.sel { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(139,157,255,.35); }
  .page.cur { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(251,113,133,.45); }
  .page.cur.sel { box-shadow: 0 0 0 2px rgba(251,113,133,.45), 0 0 0 5px rgba(139,157,255,.35); }
  .page.ghost { opacity: .35; }
  .page.chosen { cursor: grabbing; }
  .thumb {
    aspect-ratio: 1 / 1.1; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25); border-radius: 10px; overflow: hidden; position: relative;
  }
  .thumb canvas {
    background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    transition: transform .25s cubic-bezier(.2,.7,.3,1);
    max-width: 100%; max-height: 100%;
  }
  .thumb .loading { color: var(--muted); font-size: 12px; }
  .num {
    position: absolute; top: 16px; left: 16px; z-index: 2;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    background: rgba(7,8,13,.85); border: 1px solid var(--line);
  }
  .check {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 22px; height: 22px; border-radius: 7px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.5); background: rgba(7,8,13,.7);
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
  }
  .page.sel .check { background: var(--accent2); border-color: var(--accent2); color: #07080d; }
  .meta { display: flex; align-items: center; gap: 6px; margin: 8px 2px 6px; font-size: 11.5px; color: var(--muted); }
  .meta i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 4px; }
  .acts button {
    flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
    border-radius: 8px; padding: 5px 0; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .acts button:hover { background: rgba(255,255,255,.12); }
  .acts button.del:hover { background: rgba(251,113,133,.25); }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }

  .savebar label { color: var(--muted); font-size: 13px; white-space: nowrap; padding-left: 6px; }
  .savebar input {
    flex: 1; min-width: 0; background: var(--field); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
  }
  .savebar input:focus { outline: none; border-color: var(--accent); }
  .dl {
    border: none; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: linear-gradient(135deg, #fb7185, #f472b6); color: #fff; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(251,113,133,.3);
  }
  .dl:disabled { opacity: .4; cursor: default; box-shadow: none; }
  @media (max-width: 560px) { .savebar label { display: none; } .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1a1d27; border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: .25s; z-index: 70; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .thumb { cursor: pointer; }
  .thumb::after {
    content: "👁"; position: absolute; right: 8px; bottom: 8px; font-size: 13px;
    width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: rgba(7,8,13,.75); opacity: 0; transition: .15s;
  }
  .page:hover .thumb::after { opacity: 1; }

  .vbar {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .vbar .brand { font-weight: 700; font-size: 15px; letter-spacing: -.3px; white-space: nowrap; margin-right: 6px; }
  .vbar .vt { margin-right: auto; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbar .vt b { margin-right: 8px; }
  .vbar .vt span { color: var(--muted); font-size: 13px; }
  .vstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 16px 64px; }
  .vstage canvas { background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.6); max-width: 100%; max-height: 100%; }
  .vstage .loading { color: var(--muted); font-size: 14px; }
  .vempty { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .vempty div { font-size: 44px; margin-bottom: 8px; opacity: .7; }
  .vnav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08); color: #fff; font-size: 22px; cursor: pointer;
  }
  .vnav:hover:not(:disabled) { background: rgba(255,255,255,.18); }
  .vnav:disabled { opacity: .25; cursor: default; }
  .vnav.prev { left: 12px; } .vnav.next { right: 12px; }
  .vbar .btn:disabled { opacity: .35; }

  /* 좁은 화면: 저장 → 업로드 → 미리보기 → 페이지 목록 순으로 세로 배치 */
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    .app {
      height: auto; padding: 12px;
      grid-template-columns: 1fr; grid-template-rows: auto;
      grid-template-areas: "save" "upload" "view" "list";
    }
    .viewer { height: 68vh; }
    .list { overflow: visible; }
  }
  @media (max-width: 560px) { .vstage { padding: 12px; } .vnav { top: auto; bottom: 16px; transform: none; } .vbar .btn .lbl, .vbar .brand { display: none; } }

  .hint { color: #566076; font-size: 12px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
  <div class="app">
    <section class="pane viewer" aria-label="페이지 미리보기">
      <div class="vbar">
        <a href="index.html" class="home-btn" aria-label="홈으로" title="홈으로">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        </a>
        <span class="brand">📑 PDF Edit</span>
        <div class="vt" id="vTitle"></div>
        <button class="btn" id="vRotL" title="왼쪽으로 90° 회전" disabled>⟲<span class="lbl"> 왼쪽</span></button>
        <button class="btn" id="vRotR" title="오른쪽으로 90° 회전" disabled>⟳<span class="lbl"> 오른쪽</span></button>
        <button class="btn danger" id="vDel" title="이 페이지 삭제" disabled>🗑<span class="lbl"> 삭제</span></button>
      </div>
      <div class="vstage" id="vStage">
        <button class="vnav prev" id="vPrev" aria-label="이전 페이지" disabled>‹</button>
        <div id="vCanvas"></div>
        <button class="vnav next" id="vNext" aria-label="다음 페이지" disabled>›</button>
      </div>
    </section>

    <div class="pane savebar">
      <label for="fname">파일 이름</label>
      <input id="fname" value="합친문서" placeholder="파일 이름">
      <button class="dl" id="dl" disabled>💾 PDF 저장</button>
    </div>

    <label class="drop upload" id="drop">
      <div class="big">📂</div>
      <strong>PDF 파일을 끌어다 놓거나 클릭해서 선택</strong>
      <span>여러 개를 한 번에 올릴 수 있어요 · 올린 순서대로 이어 붙습니다 · 파일은 서버로 전송되지 않습니다</span>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple>
    </label>

    <section class="pane list" aria-label="페이지 목록">
      <div class="files" id="files"></div>

      <div class="toolbar" id="toolbar" hidden>
        <div class="info"><b id="pageCount">0</b>페이지 · 선택 <b id="selCount">0</b></div>
        <button class="btn" id="selAll">전체 선택</button>
        <button class="btn" id="rotL" title="선택한 페이지(없으면 전체)를 왼쪽으로 90°">⟲ 왼쪽 회전</button>
        <button class="btn" id="rotR" title="선택한 페이지(없으면 전체)를 오른쪽으로 90°">⟳ 오른쪽 회전</button>
        <button class="btn danger" id="delSel" disabled>선택 삭제</button>
        <button class="btn danger" id="clearAll">모두 지우기</button>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">아직 올린 PDF가 없습니다.</div>
      <p class="hint" id="hint" hidden>페이지를 끌어서 순서를 바꾸세요 · 클릭하면 미리보기 창에 크게 보여요 · 체크 박스로 여러 장을 골라 한꺼번에 회전/삭제할 수 있어요</p>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const COLORS = ['#fb7185', '#8b9dff', '#5eead4', '#ffd166', '#c4a5ff', '#7ce38b', '#7dd3fc', '#fb923c'];
  const $ = id => document.getElementById(id);

  // files: { id, name, bytes(Uint8Array), color, pages }
  // pages: { id, fileId, index(0-based), rot(사용자 추가 회전), sel, el }
  let files = [];
  let pages = [];
  let seq = 0;

  const toastEl = $('toast');
  let toastT;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  // ---------- 업로드 ----------
  const drop = $('drop');
  $('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  // 페이지 영역 밖에 파일을 떨어뜨려도 브라우저가 PDF를 열어버리지 않도록
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length && !drop.contains(e.target)) addFiles(e.dataTransfer.files);
  });

  async function addFiles(list) {
    const arr = [...list].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
    if (!arr.length) { if (list.length) toast('PDF 파일만 올릴 수 있어요.'); return; }
    for (const f of arr) {
      try {
        const bytes = new Uint8Array(await f.arrayBuffer());
        // pdf.js는 버퍼를 워커로 넘기며 비워버리므로 복사본을 전달
        const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
        const file = { id: ++seq, name: f.name, bytes, color: COLORS[files.length % COLORS.length], pages: doc.numPages, doc };
        files.push(file);
        const newPages = [];
        for (let i = 0; i < doc.numPages; i++) {
          const p = { id: ++seq, fileId: file.id, index: i, rot: 0, sel: false };
          pages.push(p); newPages.push(p);
          $('grid').appendChild(makeEl(p, file));
        }
        if (!vCur && newPages.length) vCur = newPages[0]; // 처음 올리면 첫 페이지를 미리보기
        renderFiles(); refresh(); renderViewer();
        for (const p of newPages) await renderThumb(p, file);
      } catch (err) {
        console.error(err);
        toast(`"${f.name}"을(를) 열 수 없어요. ${err && err.name === 'PasswordException' ? '암호가 걸린 PDF입니다.' : '손상된 파일일 수 있어요.'}`);
      }
    }
  }

  // ---------- 페이지 카드 ----------
  function makeEl(p, file) {
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.id = p.id;
    el.innerHTML = `
      <span class="num"></span>
      <span class="check" role="checkbox" aria-label="선택">✓</span>
      <div class="thumb"><span class="loading">불러오는 중…</span></div>
      <div class="meta"><i style="background:${file.color}"></i><span title="${esc(file.name)}">${esc(file.name)} · ${p.index + 1}p</span></div>
      <div class="acts">
        <button data-a="l" title="왼쪽으로 90° 회전">⟲</button>
        <button data-a="r" title="오른쪽으로 90° 회전">⟳</button>
        <button data-a="d" class="del" title="이 페이지 삭제">🗑</button>
      </div>`;
    el.querySelector('.thumb').addEventListener('click', () => openViewer(p));
    el.querySelector('.check').addEventListener('click', e => { e.stopPropagation(); p.sel = !p.sel; refresh(); });
    el.querySelector('.acts').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a === 'l') rotate([p], -90);
      if (b.dataset.a === 'r') rotate([p], 90);
      if (b.dataset.a === 'd') removePages([p]);
    });
    p.el = el;
    return el;
  }

  async function renderThumb(p, file) {
    try {
      const page = await file.doc.getPage(p.index + 1);
      const base = page.getViewport({ scale: 1 });
      const target = 220; // 썸네일 긴 변 픽셀(고해상도 화면 대비 넉넉히)
      const scale = target / Math.max(base.width, base.height);
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const box = p.el.querySelector('.thumb');
      box.innerHTML = '';
      box.appendChild(c);
      fitCanvas(p);
    } catch (err) {
      console.error(err);
      if (p.el) p.el.querySelector('.thumb').innerHTML = '<span class="loading">미리보기 실패</span>';
    }
  }

  // 회전해도 정사각형에 가까운 상자 안에 들어가도록 캔버스 표시 크기를 맞춘다
  function fitCanvas(p) {
    const c = p.el.querySelector('canvas'); if (!c) return;
    const box = p.el.querySelector('.thumb');
    const bw = box.clientWidth - 12, bh = box.clientHeight - 12;
    const sideways = Math.abs(p.rot % 180) === 90;
    const w = sideways ? c.height : c.width, h = sideways ? c.width : c.height;
    const k = Math.min(bw / w, bh / h);
    c.style.maxWidth = 'none'; c.style.maxHeight = 'none';
    c.style.width = (c.width * k) + 'px';
    c.style.height = (c.height * k) + 'px';
    c.style.transform = `rotate(${p.rot}deg)`;
  }
  window.addEventListener('resize', () => pages.forEach(fitCanvas));

  function rotate(list, deg) {
    list.forEach(p => { p.rot += deg; fitCanvas(p); });
    if (vCur && list.includes(vCur)) renderViewer();
  }

  function removePages(list) {
    const ids = new Set(list.map(p => p.id));
    const curGone = vCur && ids.has(vCur.id);
    let ci = curGone ? pages.indexOf(vCur) : -1;
    list.forEach(p => p.el.remove());
    if (curGone) {
      // 보고 있던 페이지가 지워지면 그 자리의 다음(없으면 이전) 남은 페이지를 보여준다
      const rest = pages.filter(p => !ids.has(p.id));
      const after = pages.slice(ci).find(p => !ids.has(p.id));
      vCur = after || rest[rest.length - 1] || null;
    }
    pages = pages.filter(p => !ids.has(p.id));
    // 페이지가 하나도 남지 않은 파일은 목록에서 제거
    const used = new Set(pages.map(p => p.fileId));
    files.filter(f => !used.has(f.id)).forEach(f => f.doc.destroy());
    files = files.filter(f => used.has(f.id));
    renderFiles(); refresh();
    if (curGone) renderViewer();
  }

  // ---------- 왼쪽 미리보기 ----------
  let vCur = null, vToken = 0;

  function openViewer(p) {
    vCur = p;
    refresh();
    renderViewer();
  }
  function stepViewer(d) {
    if (!vCur) return;
    const i = pages.indexOf(vCur) + d;
    if (i >= 0 && i < pages.length) {
      vCur = pages[i]; refresh(); renderViewer();
      vCur.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
  // 페이지 번호·버튼 상태만 갱신(순서 변경 등)
  function updateViewerBar() {
    const has = !!vCur;
    ['vRotL', 'vRotR', 'vDel'].forEach(id => $(id).disabled = !has);
    if (!has) { $('vTitle').innerHTML = ''; $('vPrev').disabled = $('vNext').disabled = true; return; }
    const file = files.find(f => f.id === vCur.fileId);
    const i = pages.indexOf(vCur);
    $('vTitle').innerHTML = `<b>${i + 1} / ${pages.length}</b><span>${esc(file.name)} · 원본 ${vCur.index + 1}쪽</span>`;
    $('vPrev').disabled = i <= 0;
    $('vNext').disabled = i >= pages.length - 1;
  }
  async function renderViewer() {
    const p = vCur;
    const token = ++vToken;
    updateViewerBar();
    if (!p) {
      $('vCanvas').innerHTML = pages.length
        ? '<div class="vempty"><div>👁</div>오른쪽 목록에서 페이지를 클릭하면<br>여기에 크게 보여요</div>'
        : '<div class="vempty"><div>📄</div>PDF를 올리면 여기에서<br>페이지를 크게 볼 수 있어요</div>';
      return;
    }
    const file = files.find(f => f.id === p.fileId);
    try {
      const page = await file.doc.getPage(p.index + 1);
      const rotation = (((page.rotate + p.rot) % 360) + 360) % 360;
      const base = page.getViewport({ scale: 1, rotation });
      const stage = $('vStage');
      const pad = innerWidth <= 560 ? 24 : 128;
      const fit = Math.min((stage.clientWidth - pad) / base.width, (stage.clientHeight - 32) / base.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const vp = page.getViewport({ scale: fit * dpr, rotation });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      c.style.width = (vp.width / dpr) + 'px'; c.style.height = (vp.height / dpr) + 'px';
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      if (token !== vToken) return; // 그 사이 다른 페이지로 넘어갔으면 버림
      $('vCanvas').innerHTML = '';
      $('vCanvas').appendChild(c);
    } catch (err) {
      console.error(err);
      if (token === vToken) $('vCanvas').innerHTML = '<span class="loading">미리보기를 불러오지 못했어요.</span>';
    }
  }
  $('vPrev').onclick = () => stepViewer(-1);
  $('vNext').onclick = () => stepViewer(1);
  $('vRotL').onclick = () => vCur && rotate([vCur], -90);
  $('vRotR').onclick = () => vCur && rotate([vCur], 90);
  $('vDel').onclick = () => { if (vCur) removePages([vCur]); };
  document.addEventListener('keydown', e => {
    if (!vCur || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') stepViewer(-1);
    else if (e.key === 'ArrowRight') stepViewer(1);
  });
  let vResizeT;
  window.addEventListener('resize', () => { clearTimeout(vResizeT); vResizeT = setTimeout(() => vCur && renderViewer(), 150); });

  // 스와이프로 이전/다음 페이지
  let tx = null;
  $('vStage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('vStage').addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) stepViewer(dx < 0 ? 1 : -1);
  });

  function removeFile(fileId) {
    removePages(pages.filter(p => p.fileId === fileId));
  }

  // ---------- 순서 바꾸기 (마우스·터치 드래그) ----------
  new Sortable($('grid'), {
    animation: 180,
    ghostClass: 'ghost',
    chosenClass: 'chosen',
    filter: '.acts, .check',
    preventOnFilter: false,
    delay: 120, delayOnTouchOnly: true,
    onEnd: () => {
      const order = [...$('grid').children].map(el => +el.dataset.id);
      const map = new Map(pages.map(p => [p.id, p]));
      pages = order.map(id => map.get(id));
      refresh();
    }
  });

  // ---------- 툴바 ----------
  const targets = () => { const s = pages.filter(p => p.sel); return s.length ? s : pages; };
  $('rotL').onclick = () => rotate(targets(), -90);
  $('rotR').onclick = () => rotate(targets(), 90);
  $('selAll').onclick = () => {
    const all = pages.every(p => p.sel);
    pages.forEach(p => p.sel = !all); refresh();
  };
  $('delSel').onclick = () => removePages(pages.filter(p => p.sel));
  $('clearAll').onclick = () => { if (confirm('올린 파일과 페이지를 모두 지울까요?')) removePages([...pages]); };

  function renderFiles() {
    $('files').innerHTML = '';
    files.forEach(f => {
      const n = pages.filter(p => p.fileId === f.id).length;
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<i style="background:${f.color}"></i><span class="nm" title="${esc(f.name)}">${esc(f.name)}</span><span class="ct">${n}/${f.pages}p</span><button title="이 파일의 페이지 모두 빼기">✕</button>`;
      chip.querySelector('button').onclick = () => removeFile(f.id);
      $('files').appendChild(chip);
    });
  }

  function refresh() {
    pages.forEach((p, i) => {
      p.el.querySelector('.num').textContent = i + 1;
      p.el.classList.toggle('sel', p.sel);
      p.el.classList.toggle('cur', p === vCur);
    });
    updateViewerBar();
    const n = pages.length, s = pages.filter(p => p.sel).length;
    $('pageCount').textContent = n;
    $('selCount').textContent = s;
    $('selAll').textContent = n && s === n ? '선택 해제' : '전체 선택';
    $('delSel').disabled = !s;
    $('rotL').textContent = s ? '⟲ 선택 왼쪽 회전' : '⟲ 전체 왼쪽 회전';
    $('rotR').textContent = s ? '⟳ 선택 오른쪽 회전' : '⟳ 전체 오른쪽 회전';
    $('toolbar').hidden = !n;
    $('hint').hidden = !n;
    $('empty').hidden = !!n;
    $('dl').disabled = !n;
    drop.classList.toggle('compact', !!n);
    if (n && files.length === 1) {
      const def = files[0].name.replace(/\.pdf$/i, '') + '_편집';
      if ($('fname').dataset.auto !== 'off') $('fname').value = def;
    } else if (files.length > 1 && $('fname').dataset.auto !== 'off') {
      $('fname').value = '합친문서';
    }
  }
  $('fname').addEventListener('input', () => $('fname').dataset.auto = 'off');

  // ---------- 저장 ----------
  // 크롬·엣지(PC)는 '다른 이름으로 저장' 창으로 폴더와 이름을 고르고,
  // 지원하지 않는 브라우저는 일반 다운로드로 저장한다.
  const canPick = 'showSaveFilePicker' in window && window.self === window.top;

  function fileName() {
    let name = ($('fname').value.trim() || '합친문서').replace(/[\\/:*?"<>|]/g, '_');
    if (!/\.pdf$/i.test(name)) name += '.pdf';
    return name;
  }

  async function buildPdf() {
    const { PDFDocument, degrees } = PDFLib;
    const out = await PDFDocument.create();
    const loaded = new Map();
    for (const p of pages) {
      let src = loaded.get(p.fileId);
      if (!src) {
        const f = files.find(f => f.id === p.fileId);
        src = await PDFDocument.load(f.bytes, { ignoreEncryption: true });
        loaded.set(p.fileId, src);
      }
      const [cp] = await out.copyPages(src, [p.index]);
      const angle = (((cp.getRotation().angle + p.rot) % 360) + 360) % 360;
      cp.setRotation(degrees(angle));
      out.addPage(cp);
    }
    return out.save();
  }

  function download(bytes, name) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  $('dl').onclick = async () => {
    if (!pages.length) return;
    const btn = $('dl');
    let name = fileName();
    let handle = null;
    if (canPick) {
      // 저장 창은 클릭 직후에 띄워야 하므로 PDF를 만들기 전에 먼저 연다
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: name,
          id: 'playkit-pdfedit', // 마지막에 저장한 폴더를 기억
          types: [{ description: 'PDF 문서', accept: { 'application/pdf': ['.pdf'] } }]
        });
        name = handle.name;
      } catch (err) {
        if (err.name === 'AbortError') return; // 사용자가 취소
        console.warn('저장 창을 열 수 없어 일반 다운로드로 저장합니다.', err);
        handle = null;
      }
    }
    btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      const bytes = await buildPdf();
      if (handle) {
        const w = await handle.createWritable();
        await w.write(bytes);
        await w.close();
        toast(`${pages.length}페이지짜리 "${name}"을(를) 저장했어요.`);
      } else {
        download(bytes, name);
        toast(`${pages.length}페이지짜리 "${name}"을(를) 다운로드했어요.`);
      }
    } catch (err) {
      console.error(err);
      toast('PDF를 만드는 중 오류가 났어요. 암호가 걸린 파일이 섞여 있는지 확인해 주세요.');
    } finally {
      btn.disabled = !pages.length; btn.textContent = '💾 PDF 저장';
    }
  };
  if (!canPick) $('dl').title = '이 브라우저에서는 다운로드 폴더에 저장됩니다. 저장 위치를 고르려면 크롬·엣지(PC)를 쓰거나 브라우저 설정에서 "다운로드 전에 저장 위치 확인"을 켜세요.';
  else $('dl').title = '저장할 폴더와 파일 이름을 고를 수 있어요';

  renderViewer(); // 빈 미리보기 안내 표시

  function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
</html>
